<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Connection Status</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
    radial-gradient(circle at top left,#00ff9530,transparent 30%),
    radial-gradient(circle at bottom right,#00ff9530,transparent 30%),
    #020303;
    overflow:hidden;
}

/* Floating glow particles */
body::before,
body::after{
    content:'';
    position:absolute;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.15;
}

body::before{
    background:#00ff99;
    top:-100px;
    left:-100px;
}

body::after{
    background:#00ff99;
    bottom:-100px;
    right:-100px;
}

.modal{
    width:min(92%,420px);
    background:rgba(0,0,0,0.82);
    border:1px solid rgba(0,255,153,0.18);
    backdrop-filter:blur(18px);
    border-radius:28px;
    padding:35px 28px;
    position:relative;
    overflow:hidden;
    box-shadow:
    0 0 40px rgba(0,255,153,0.08),
    inset 0 0 30px rgba(0,255,153,0.03);
    animation:fadeIn .6s ease;
}

.modal::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(
    135deg,
    rgba(255,255,255,0.04),
    transparent 30%,
    rgba(0,255,153,0.03)
    );
    pointer-events:none;
}

.close{
    position:absolute;
    top:18px;
    right:20px;
    font-size:28px;
    color:#7f8b85;
    cursor:pointer;
    transition:.2s;
}

.close:hover{
    color:#fff;
}

.spinner-wrap{
    display:flex;
    justify-content:center;
    margin-top:10px;
}

.spinner{
    width:90px;
    height:90px;
    border-radius:50%;
    border:5px solid rgba(255,255,255,0.08);
    border-top:5px solid #00ff99;
    animation:spin 1s linear infinite;
    position:relative;
    box-shadow:0 0 25px rgba(0,255,153,.25);
}

.spinner::before{
    content:'';
    position:absolute;
    inset:10px;
    border-radius:50%;
    border:2px solid rgba(0,255,153,.18);
}

h1{
    text-align:center;
    margin-top:28px;
    color:white;
    font-size:1.7rem;
    font-weight:700;
    line-height:1.3;
}

.fail{
    color:#00ff99;
    text-shadow:0 0 15px rgba(0,255,153,.45);
}

.sub{
    margin-top:16px;
    text-align:center;
    color:#8b9390;
    font-size:.97rem;
    line-height:1.5;
}

.progress-container{
    width:100%;
    height:12px;
    background:rgba(255,255,255,0.06);
    border-radius:20px;
    overflow:hidden;
    margin-top:32px;
    position:relative;
}

.progress-bar{
    width:0%;
    height:100%;
    border-radius:20px;
    background:linear-gradient(
    90deg,
    #00c978,
    #00ff99,
    #6fffc4
    );
    box-shadow:0 0 20px rgba(0,255,153,.55);
    transition:width .2s linear;
}

.percent{
    text-align:center;
    margin-top:16px;
    color:#c8d0cc;
    font-size:1rem;
    font-weight:600;
    letter-spacing:.5px;
}

.status-box{
    margin-top:24px;
    border:1px solid rgba(0,255,153,.12);
    background:rgba(255,255,255,0.02);
    border-radius:18px;
    padding:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.status-label{
    color:#8f9995;
    font-size:.92rem;
}

.status-value{
    color:#00ff99;
    font-weight:700;
    text-shadow:0 0 10px rgba(0,255,153,.4);
}

.cancel{
    margin-top:28px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:18px;
    background:rgba(255,255,255,0.05);
    color:#d7d7d7;
    font-size:1rem;
    cursor:pointer;
    transition:.25s;
}

.cancel:hover{
    background:rgba(0,255,153,.12);
    color:#00ff99;
}

.failed{
    animation:shake .45s ease;
}

.failed .spinner{
    border-top:5px solid #ff4d4d;
    box-shadow:0 0 25px rgba(255,77,77,.3);
}

.failed .fail{
    color:#ff5757;
    text-shadow:0 0 18px rgba(255,87,87,.35);
}

.failed .progress-bar{
    background:linear-gradient(90deg,#ff4444,#ff6666);
    box-shadow:0 0 20px rgba(255,77,77,.35);
}

@keyframes spin{
    100%{transform:rotate(360deg);}
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px) scale(.98);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
}

@media(max-width:480px){
    h1{
        font-size:1.45rem;
    }

    .modal{
        padding:30px 22px;
    }
}
</style>
</head>
<body>

<div class="modal" id="modal">

    <div class="close">×</div>

    <div class="spinner-wrap">
        <div class="spinner"></div>
    </div>

    <h1 id="title">
        Establishing Secure <span class="fail">Connection</span>
    </h1>

    <p class="sub" id="subtitle">
        Please wait while we verify your session and process your request securely.
    </p>

    <div class="progress-container">
        <div class="progress-bar" id="bar"></div>
    </div>

    <div class="percent" id="percent">
        0% complete
    </div>

    <div class="status-box">
        <div>
            <div class="status-label">Connection Status</div>
        </div>

        <div class="status-value" id="statusText">
            CONNECTING
        </div>
    </div>

    <button class="cancel">
        Cancel
    </button>

</div>

<script>
const bar = document.getElementById('bar');
const percent = document.getElementById('percent');
const modal = document.getElementById('modal');
const title = document.getElementById('title');
const subtitle = document.getElementById('subtitle');
const statusText = document.getElementById('statusText');

let progress = 0;

const fakeLoader = setInterval(() => {

    progress += Math.floor(Math.random() * 6) + 2;

    if(progress >= 93){
        progress = 93;
    }

    bar.style.width = progress + '%';
    percent.innerText = progress + '% complete';

}, 220);

setTimeout(() => {

    clearInterval(fakeLoader);

    progress = 100;
    bar.style.width = '100%';
    percent.innerText = '100% complete';

    modal.classList.add('failed');

    title.innerHTML = `
        Connection <span class="fail">Failed</span>
    `;

    subtitle.innerHTML = `
        Unable to establish a secure connection.<br>
        Please ensure you are using a supported wallet and try again.
    `;

    statusText.innerText = 'FAILED';
    statusText.style.color = '#ff5757';

}, 6500);
</script>

</body>
</html>
